<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ rel }}index.html">
      <img src="{{ rel }}assets/images/adea-logo.png" alt="ADEA logo" width="38" height="38">
      <span class="brand__name">ADEA</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <div class="nav__links" id="nav-links">
        <a href="{{ rel }}index.html"{% if page.nav == 'home' %} class="is-active"{% endif %}>Home</a>
        <a href="{{ rel }}about.html"{% if page.nav == 'about' %} class="is-active"{% endif %}>About</a>
        <a href="{{ rel }}news.html"{% if page.nav == 'news' %} class="is-active"{% endif %}>News and Events</a>
        <a href="{{ rel }}stories.html"{% if page.nav == 'research' %} class="is-active"{% endif %}>Research</a>
        <a href="{{ rel }}members.html"{% if page.nav == 'members' %} class="is-active"{% endif %}>Members</a>
      </div>
      <a class="btn btn--accent" href="{{ rel }}join.html">Join</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </nav>
  </div>
</header>
